<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found | Guidy</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@font-face{font-family:"Nunito Sans";font-style:normal;font-weight:400 800;font-display:swap;src:url(/fonts/nunito-sans-latin.woff2) format("woff2")}
:root{--bg:#f8fafc;--ink:#0b1b2b;--muted:#475569;--link:#1c75b0;--card:#fff;--rule:#e2e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1722;--ink:#fff;--muted:#94a3b8;--link:#2da3e3;--card:#182230;--rule:#223042}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:16px/1.65 "Nunito Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:460px;text-align:center;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px 26px}
img{height:34px;width:auto}
.logo-d{display:none}
@media (prefers-color-scheme:dark){.logo-l{display:none}.logo-d{display:inline}}
h1{font-size:1.5rem;margin:.8em 0 .2em}
p{margin:.4em 0;color:var(--muted)}
a{color:var(--link);font-weight:700}
[lang=ar]{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif}
</style>
</head>
<body>
<main>
  <img class="logo-l" src="/logo-horizontal.svg" alt="Guidy" width="99" height="34"><img class="logo-d" src="/logo-horizontal-white.svg" alt="Guidy" width="99" height="34">
  <h1>Page not found</h1>
  <p>That page doesn't exist, or it has moved.</p>
  <p><a href="/">Go to the Guidy home page</a></p>
  <p lang="ar" dir="rtl"><a href="/ar">الصفحة مش موجودة. ارجع للرئيسية</a></p>
</main>
</body>
</html>

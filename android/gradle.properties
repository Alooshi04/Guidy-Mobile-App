org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 9 compiles Kotlin itself. It has to say "true" here: when the line is
# missing, flutter build writes "android.builtInKotlin=false" back in. Don't
# set it to false as Flutter's template does: share_plus 13, package_info_plus
# 10 and flutter_device_compass skip the Kotlin plugin on AGP 9, so their
# Kotlin would not be compiled.
android.builtInKotlin=true
# AGP 9 turned on R8's strict full mode: a library keep rule that names a
# class but no members no longer keeps its no-arg constructor. Room 2.2.5's
# "-keep class * extends androidx.room.RoomDatabase" and WorkManager 2.7.0's
# InputMerger rule rely on it (both come in through Google's ads/Firebase
# SDKs), so the release app crashed at launch: "Failed to create an instance
# of androidx.work.impl.WorkDatabase". This restores AGP 8's behaviour.
android.r8.strictFullModeForKeepRules=false
